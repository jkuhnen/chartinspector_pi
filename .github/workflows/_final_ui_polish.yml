name: Temporary final UI polish
on:
  push:
    branches: [ui/chartinspector-final-polish]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/chartinspector-final-polish
      - name: Patch plugin UI
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('src/chartinspector_pi.cpp')
          s = path.read_text(encoding='utf-8')
          s = s.replace('#include "ui/app_style.h"\n', '#include "ui/app_style.h"\n#include "ui/object_inspector_panel.h"\n', 1)

          s = s.replace('void ChartInspectorPi::ApplyInfoTheme() {\n  if (!m_infoPanel) return;\n', '''void ChartInspectorPi::ApplyInfoTheme() {\n  if (!m_infoPanel) return;\n  if (auto *panel = dynamic_cast<ci_ui::ObjectInspectorPanel *>(m_infoPanel)) {\n    panel->SetScheme(m_colorScheme);\n    return;\n  }\n''', 1)

          s = s.replace('void ChartInspectorPi::BuildVisualSummary() {\n  if (!m_infoVisual) return;\n', '''void ChartInspectorPi::BuildVisualSummary() {\n  if (dynamic_cast<ci_ui::ObjectInspectorPanel *>(m_infoPanel)) return;\n  if (!m_infoVisual) return;\n''', 1)

          build_panel = r'''void ChartInspectorPi::BuildInfoPanel(wxWindow *canvas) {
  if (m_infoPanel || !canvas) return;
  auto *panel = new ci_ui::ObjectInspectorPanel(canvas);
  panel->SetScheme(m_colorScheme);
  panel->SetCloseHandler([this]() { HideObjectPopup(); });
  m_infoPanel = panel;
  m_infoPanel->Hide();
}

'''
          s, n = re.subn(r'void ChartInspectorPi::BuildInfoPanel\(wxWindow \*canvas\) \{.*?\n\}\n\n(?=void ChartInspectorPi::HideObjectPopup)', build_panel, s, count=1, flags=re.S)
          assert n == 1, 'BuildInfoPanel replacement failed'

          show_popup = r'''void ChartInspectorPi::ShowObjectPopup() {
  if (!m_enabled || !m_hasVectorObject || m_lastFeature.IsEmpty()) return;
  wxWindow *canvas = GetOCPNCanvasWindow();
  if (!canvas) return;
  BuildInfoPanel(canvas);
  auto *panel = dynamic_cast<ci_ui::ObjectInspectorPanel *>(m_infoPanel);
  if (!panel) return;

  ci_ui::ObjectInspectorData data;
  data.title = CI_CleanDecodedCodes(m_s57Catalog.ObjectName(m_lastFeature));
  if (data.title.IsEmpty()) data.title = m_lastFeature;
  data.objectName = m_lastObjectName;
  data.featureClass = m_lastFeature;
  data.geometry = m_lastPrimitiveType == 3 ? "Area" :
                  m_lastPrimitiveType == 2 ? "Line" : "Point";

  const wxString catcamRaw =
      m_s57Catalog.RawAttributeValue(m_lastAttributes, "CATCAM");
  long catcam = 0;
  if (m_lastFeature == "BOYCAR" && catcamRaw.ToLong(&catcam) &&
      catcam >= 1 && catcam <= 4) {
    data.cardinalCategory = static_cast<int>(catcam);
    switch (catcam) {
      case 1: data.cardinalLabel = "North cardinal"; break;
      case 2: data.cardinalLabel = "East cardinal"; break;
      case 3: data.cardinalLabel = "South cardinal"; break;
      case 4: data.cardinalLabel = "West cardinal"; break;
    }
    data.cardinalColours = CI_DecodeColours(
        m_s57Catalog.RawAttributeValue(m_lastAttributes, "COLOUR")).Lower();
  }

  const CI_NavigationInfo info = CI_BuildNavigationInfo(
      m_s57Catalog, m_lastFeature, m_lastObjectName, m_lastAttributes,
      m_lastPrimitiveType, m_showTechnicalData);

  if (!info.primary.IsEmpty()) {
    const int colon = info.primary.Find(':');
    if (colon == wxNOT_FOUND) {
      data.primaryValue = info.primary;
      data.primaryLabel = "Navigation value";
    } else {
      data.primaryLabel = info.primary.Left(colon);
      data.primaryValue = info.primary.Mid(colon + 1);
      data.primaryLabel.Trim(true); data.primaryLabel.Trim(false);
      data.primaryValue.Trim(true); data.primaryValue.Trim(false);
    }
  }

  wxStringTokenizer detailLines(info.details, "\n", wxTOKEN_STRTOK);
  const wxString colourRaw =
      m_s57Catalog.RawAttributeValue(m_lastAttributes, "COLOUR");
  while (detailLines.HasMoreTokens()) {
    wxString line = detailLines.GetNextToken();
    const int colon = line.Find(':');
    if (colon == wxNOT_FOUND) continue;
    wxString label = line.Left(colon);
    wxString value = line.Mid(colon + 1);
    label.Trim(true); label.Trim(false);
    value.Trim(true); value.Trim(false);
    if (label == "Name") continue;
    if (data.cardinalCategory &&
        (label == "Category of cardinal" || label == "Color")) continue;
    ci_ui::InspectorProperty prop;
    prop.label = label;
    prop.value = value;
    if (label == "Color") {
      wxStringTokenizer colours(colourRaw, ",", wxTOKEN_STRTOK);
      while (colours.HasMoreTokens()) {
        wxString token = colours.GetNextToken();
        token.Trim(true); token.Trim(false);
        if (!token.IsEmpty()) prop.colours.push_back(SignalColour(token));
      }
    }
    data.properties.push_back(prop);
  }

  wxString lightAttributes;
  if (m_lastFeature == "LIGHTS") lightAttributes = m_lastAttributes;
  else if (m_hasAssociatedLight) lightAttributes = m_associatedLightAttributes;
  if (!lightAttributes.IsEmpty()) {
    data.lightSummary = CI_LightSummary(m_s57Catalog, lightAttributes);
    const wxString range =
        m_s57Catalog.RawAttributeValue(lightAttributes, "VALNMR");
    double nm = 0.0;
    if (CI_ParseNumber(range, &nm))
      data.lightRange = wxString::Format("%g NM", nm);
    const wxString lightColourRaw =
        m_s57Catalog.RawAttributeValue(lightAttributes, "COLOUR");
    wxStringTokenizer colours(lightColourRaw, ",", wxTOKEN_STRTOK);
    while (colours.HasMoreTokens()) {
      wxString token = colours.GetNextToken();
      token.Trim(true); token.Trim(false);
      if (!token.IsEmpty()) data.lightColours.push_back(SignalColour(token));
    }
  }

  if (m_showTechnicalData) {
    data.technical = info.technical;
    if (m_hasAssociatedLight) {
      wxString lightTechnical;
      m_s57Catalog.FormatAttributes(m_associatedLightAttributes, &lightTechnical);
      if (!lightTechnical.IsEmpty())
        data.technical += "\nAssociated LIGHTS\n" + lightTechnical;
    }
  }

  panel->SetScheme(m_colorScheme);
  panel->SetData(data);
  const wxSize size = panel->GetSize();
  const wxSize canvasSize = canvas->GetClientSize();
  panel->Move(std::max(12, canvasSize.GetWidth() - size.GetWidth() - 14), 14);
  panel->Show();
  panel->Raise();
}

'''
          s, n = re.subn(r'void ChartInspectorPi::ShowObjectPopup\(\) \{.*?\n\}\n\n(?=void ChartInspectorPi::QueryAssociatedLight)', show_popup, s, count=1, flags=re.S)
          assert n == 1, 'ShowObjectPopup replacement failed'
          path.write_text(s, encoding='utf-8')

          demo = Path('demo/maritimeui_pi/src/maritimeui_pi.cpp')
          d = demo.read_text(encoding='utf-8')
          replacements = {
            '"OBJECT INSPECTOR"': '"Object inspector"',
            '"NORTH CARDINAL BUOY"': '"North cardinal buoy"',
            '"BOYCAR  ·  POINT"': '"BOYCAR | POINT"',
            '"NORTH CARDINAL"': '"North cardinal"',
            '"LIGHT CHARACTER"': '"Light characteristic"',
            '"NOMINAL RANGE"': '"Nominal range"',
            '"CHART SOURCE"': '"Chart source"',
            '"DK ENC · current"': '"DK ENC | current"',
            '"SCALE"': '"Scale"',
            '"POSITION"': '"Position"',
            '"SOURCE / TECHNICAL"': '"Source / technical"',
          }
          for old, new in replacements.items(): d = d.replace(old, new)
          d = d.replace('DrawStatusDot(dc, 22, y + 7, m_palette.warning);\n    DrawText(dc, "Scale", 36, y, tiny, m_palette.textSecondary);\n    DrawText(dc, "Not shown at current scale", 150, y - 1, label,\n             m_palette.warning);', 'DrawStatusDot(dc, 22, y + 7, m_palette.accent);\n    DrawText(dc, "Scale", 36, y, tiny, m_palette.textSecondary);\n    DrawText(dc, "Not shown at current scale", 150, y - 1, label,\n             m_palette.textSecondary);')
          demo.write_text(d, encoding='utf-8')

          cm = Path('demo/maritimeui_pi/CMakeLists.txt')
          c = cm.read_text(encoding='utf-8').replace('project(maritimeui VERSION 0.2.1.0', 'project(maritimeui VERSION 0.3.0.0')
          cm.write_text(c, encoding='utf-8')
      - name: Commit patch and remove helper
        shell: bash
        run: |
          rm .github/workflows/_final_ui_polish.yml
          git config user.name "openai-assistant"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/chartinspector_pi.cpp demo/maritimeui_pi/src/maritimeui_pi.cpp demo/maritimeui_pi/CMakeLists.txt .github/workflows/_final_ui_polish.yml
          git diff --cached --check
          git commit -m "Polish maritime UI and integrate real Chart Inspector data"
          git push origin HEAD:ui/chartinspector-final-polish
